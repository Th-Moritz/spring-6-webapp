<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spring Framework</title>
</head>
<body>
<h1>Book List</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Publisher</th>
    </tr>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">Display Id</td>
        <td th:text="${book.title}">Display Title</td>
        <td th:text="${book.publisher.publisherName}">Display Name</td>
    </tr>
</table>

</body>
</html>
